name: masked-infer CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 所有 job 显式 GOWORK=off：CI 不依赖 go.work workspace，也不引用主仓。
env:
  GOWORK: off

jobs:
  # G1 常驻门禁（§5 阶段 0 起）：含 _test.go 的依赖闭包零主仓 / 零 gmsm 前缀。
  g1:
    name: G1 forbidden-dependency gate
    runs-on: ubuntu-latest
    env:
      GOWORK: off
      MAIN_MOD: security-ai-gateway
      SUB_ORG: FengYang
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - name: Run G1
        shell: bash
        run: bash scripts/gate_g1.sh

  # G2 golden 逐字节一致性（阶段 1 起生效）。阶段 0 的 masklite 尚无 .go 源码，
  # 用文件存在性守卫避免判红；CA-1 落地后自动启用。
  g2:
    name: G2 stream golden
    runs-on: ubuntu-latest
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - name: Run G2 golden test
        shell: bash
        run: |
          if [ -f masklite/masklite.go ]; then
            go test ./masklite/... -run TestGolden -count=1
          else
            echo "G2 SKIP (Stage 0): masklite/masklite.go absent; golden test starts at Stage 1 / CA-1"
          fi

  # cgo / !cgo 双构建。
  build:
    name: build (CGO_ENABLED=${{ matrix.cgo }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cgo: ['0', '1']
    env:
      GOWORK: off
      CGO_ENABLED: ${{ matrix.cgo }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - name: go build ./...
        shell: bash
        run: go build ./...

  # 🖥 待环境就绪：GPU 轨道，本轮不执行。
  # CUDA 与昇腾为双一等公民，两个 ACCEL_BACKEND_LIB 取值并列保留配置骨架；
  # 待真机 GPU 环境就绪后去掉 if: false 并补齐驱动依赖即可启用。
  accel:
    name: accel (ACCEL_BACKEND_LIB=${{ matrix.accel }})
    if: false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        accel: [cuda, ascend]
    env:
      GOWORK: off
      ACCEL_BACKEND_LIB: ${{ matrix.accel }}
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - name: go build ./... (GPU track)
        shell: bash
        run: go build ./...
