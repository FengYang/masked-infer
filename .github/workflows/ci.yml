name: masked-infer CI

on:
  push:
    # 新库本地初始分支为 master；阶段 5 发布前与远端默认分支对齐。
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# 所有 job 显式 GOWORK=off：CI 不依赖 go.work workspace，也不引用主仓。
env:
  GOWORK: off

jobs:
  # G1 常驻门禁（阶段 0 起）：含 _test.go 的依赖闭包零主仓 / 零 gmsm 前缀。
  g1:
    name: G1 forbidden-dependency gate
    runs-on: ubuntu-latest
    env:
      GOWORK: off
      MAIN_MOD: security-ai-gateway
      SUB_ORG: FengYang
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - name: Run G1
        shell: bash
        run: bash scripts/gate_g1.sh

  # G2 golden 逐字节一致性（阶段 1 起生效）。阶段 0 的 masklite 尚无 .go 源码，
  # 用文件存在性守卫避免判红；CA-1 落地后自动启用。
  # 阶段 1 CA-1 交付必须含 masklite/masklite_test.go 且测试函数名冻结为 TestGolden
  # （与下方守卫一致）；否则 -run 无匹配仍 exit 0，会静默判绿。
  g2:
    name: G2 stream golden
    runs-on: ubuntu-latest
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - name: Run G2 golden test
        shell: bash
        run: |
          set -euo pipefail
          if [ -f masklite/masklite.go ] && [ -f masklite/masklite_test.go ]; then
            go test ./masklite/... -run TestGolden -count=1 -v 2>&1 | tee /tmp/g2.log
            grep -q '^=== RUN   TestGolden' /tmp/g2.log || { echo "G2 FAIL: no TestGolden executed"; exit 1; }
          elif [ -f masklite/masklite.go ]; then
            echo "G2 FAIL: masklite source present but test absent"
            exit 1
          else
            echo "G2 SKIP (before CA-1): masklite source/test absent; golden test starts at Stage 1 / CA-1"
          fi

  # 真测试 job（阶段 1 起 go test 才有意义）：go vet + go test ./...
  # 不调用 scripts/verify_all.sh（本地复验入口，依赖主仓目录）；CI 用真 go list/go test 更强。
  test:
    name: test (go vet + go test)
    runs-on: ubuntu-latest
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - name: go vet and go test
        shell: bash
        run: |
          set -euo pipefail
          go vet ./...
          go test ./... -count=1

  # cgo / !cgo 双构建。
  build:
    name: build (CGO_ENABLED=${{ matrix.cgo }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cgo: ['0', '1']
    env:
      GOWORK: off
      CGO_ENABLED: ${{ matrix.cgo }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - name: go build ./...
        shell: bash
        run: go build ./...

  # 🖥 待环境就绪：GPU 轨道，环境恢复后显式启用并取证；CUDA 与 ascend 并列双一等公民。
  # 默认不执行：仅当执行人手动 workflow_dispatch 显式触发时启用，并须先补齐 GPU 驱动依赖。
  accel:
    name: accel (ACCEL_BACKEND_LIB=${{ matrix.accel }})
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        accel: [cuda, ascend]
    env:
      GOWORK: off
      ACCEL_BACKEND_LIB: ${{ matrix.accel }}
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - name: go build ./... (GPU track)
        shell: bash
        run: go build ./...
